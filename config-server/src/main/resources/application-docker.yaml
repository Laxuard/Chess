server:
  ssl:
    trust-store: file:/app/certs/truststore/truststore.p12
    key-store: file:/app/certs/services/config-server/config-server.p12

spring:
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:/app/config-repo
            - file:/app/config-repo/{application}