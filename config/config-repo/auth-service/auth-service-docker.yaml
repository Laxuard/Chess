# ==========================================
# AUTH SERVICE DOCKER OVERRIDES
# ==========================================

spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/transcendence_auth
  
  data:
    redis:
      host: redis-container
  
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "https://gateway:8443/.well-known/jwks.json"
