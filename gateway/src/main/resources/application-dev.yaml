server:
  ssl:
    enabled: true
    key-store: "file:${user.home}/1337/Microservices/certs/gateway.p12"
    key-store-password: ${CERT_PASSWORD:password}
    trust-store: "file:${user.home}/1337/Microservices/certs/truststore.p12"
    trust-store-password: ${CERT_PASSWORD:password}

spring:
  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD:password}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            ssl:
              use-insecure-trust-manager: true

jwt:
  private-key-path: "file:${user.home}/1337/Microservices/certs/jwt_private_pkcs8.pem"
  public-key-path: "file:${user.home}/1337/Microservices/certs/jwt_public.pem"


eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: https://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD:password}@localhost:8761/eureka/
    tls:
      enabled: true
      trust-store: "file:${user.home}/1337/Microservices/certs/truststore.p12"
      trust-store-password: ${CERT_PASSWORD:password}
      key-store: "file:${user.home}/1337/Microservices/certs/gateway.p12"
      key-store-password: ${CERT_PASSWORD:password}
      key-password: ${CERT_PASSWORD:password}



management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always