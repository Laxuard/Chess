# ==========================================
# TRANSCENDENCE MICROSERVICES APPLICATION STACK
# ==========================================
# Run after starting the infrastructure compose stack:
# docker compose -f docker-compose.yml up -d
# docker compose -f docker-compose.apps.yml up --build -d

services:
  # == 1. Spring Cloud Config Server (Internal Only) ==
  config-server:
    build:
      context: ../services/config-server
      dockerfile: Dockerfile
    image: transcendence-config-server:latest
    container_name: config-server
    environment:
      - SPRING_PROFILES_ACTIVE=native,docker
      - CONFIG_SERVER_PORT=${CONFIG_SERVER_PORT}
      - CERT_PASSWORD=${CERT_PASSWORD}
    volumes:
      - ../certs:/app/certs:ro             # Mounts secure mTLS keystores/truststores
      - ../config/config-repo:/app/config-repo:ro # Mounts local git configuration repository
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/config-server/config-server.p12:${CERT_PASSWORD}", "--cert-type", "P12", "-f", "https://localhost:${CONFIG_SERVER_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - transcendence-net

  # == 2. Eureka Service Discovery Registry (Internal Only) ==
  eureka-server:
    build:
      context: ../services/eureka-server
      dockerfile: Dockerfile
    image: transcendence-eureka-server:latest
    container_name: eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_PORT=${EUREKA_PORT}
      - CONFIG_SERVER_PORT=${CONFIG_SERVER_PORT}
      - CERT_PASSWORD=${CERT_PASSWORD}
    volumes:
      - ../certs:/app/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/eureka-server/eureka-server.p12:${CERT_PASSWORD}", "--cert-type", "P12", "-f", "https://localhost:${EUREKA_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - transcendence-net

  # == 3. Core Authentication Service (Internal Only) ==
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    image: transcendence-auth-service:latest
    container_name: auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT}
      - CONFIG_SERVER_PORT=${CONFIG_SERVER_PORT}
      - EUREKA_PORT=${EUREKA_PORT}
      - CERT_PASSWORD=${CERT_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - POSTGRES_PORT=5432
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - GATEWAY_PORT=${GATEWAY_PORT}
    volumes:
      - ../certs:/app/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/auth-service/auth-service.p12:${CERT_PASSWORD}", "--cert-type", "P12", "-f", "https://localhost:${AUTH_SERVICE_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - transcendence-net

  # == 4. Backend-For-Frontend (BFF) Gateway (Public Entrypoint) ==
  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    image: transcendence-gateway:latest
    container_name: gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}" # ONLY the Gateway is exposed to the host system!
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GATEWAY_PORT=${GATEWAY_PORT}
      - CONFIG_SERVER_PORT=${CONFIG_SERVER_PORT}
      - EUREKA_PORT=${EUREKA_PORT}
      - CERT_PASSWORD=${CERT_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
    volumes:
      - ../certs:/app/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/gateway/gateway.p12:${CERT_PASSWORD}", "--cert-type", "P12", "-f", "https://localhost:${GATEWAY_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - transcendence-net

  # == 5. Node.js Service (Test Drive) ==
  nodejs-service:
    build:
      context: ../services/nodejs-service
      dockerfile: Dockerfile
    image: transcendence-nodejs-service:latest
    container_name: nodejs-service
    environment:
      - PORT=8083
      - SPRING_APPLICATION_NAME=nodejs-service
      - EUREKA_URL=https://eureka-server:${EUREKA_PORT:-8761}/eureka/
      - CERT_DIR_PATH=/app/certs
      - JWKS_URI=https://gateway:${GATEWAY_PORT:-8080}/.well-known/jwks.json
      - JWT_PUBLIC_KEY_PATH=/app/certs/jwt/jwt_public.pem
      - CERT_PASSWORD=${CERT_PASSWORD}
    volumes:
      - ../certs:/app/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/nodejs-service/nodejs-service.crt", "--key", "/app/certs/services/nodejs-service/nodejs-service.key", "-f", "https://localhost:8083/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - transcendence-net

  # == 6. Python Service (Test Drive) ==
  python-service:
    build:
      context: ../services/python-service
      dockerfile: Dockerfile
    image: transcendence-python-service:latest
    container_name: python-service
    environment:
      - PORT=8082
      - SPRING_APPLICATION_NAME=python-service
      - EUREKA_URL=https://eureka-server:${EUREKA_PORT:-8761}/eureka/
      - CERT_DIR_PATH=/app/certs
      - JWKS_URI=https://gateway:${GATEWAY_PORT:-8080}/.well-known/jwks.json
      - JWT_PUBLIC_KEY_PATH=/app/certs/jwt/jwt_public.pem
      - CERT_PASSWORD=${CERT_PASSWORD}
    volumes:
      - ../certs:/app/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/python-service/python-service.crt", "--key", "/app/certs/services/python-service/python-service.key", "-f", "https://localhost:8082/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - transcendence-net

  # == Auto-Generated Service: billing-service ==
  billing-service:
    build:
      context: ../services/billing-service
      dockerfile: Dockerfile
    image: transcendence-billing-service:latest
    container_name: billing-service
    environment:
      - PORT=8083
      - SPRING_APPLICATION_NAME=billing-service
      - EUREKA_URL=https://eureka-server:${EUREKA_PORT:-8761}/eureka/
      - CERT_DIR_PATH=/app/certs
      - JWKS_URI=https://gateway:${GATEWAY_PORT:-8080}/.well-known/jwks.json
      - JWT_PUBLIC_KEY_PATH=/app/certs/jwt/jwt_public.pem
      - CERT_PASSWORD=${CERT_PASSWORD}
    volumes:
      - ../certs:/app/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/billing-service/billing-service.p12:${CERT_PASSWORD}", "--cert-type", "P12", "-f", "https://localhost:8083/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - transcendence-net
  # == Auto-Generated Service: chat-service ==
  chat-service:
    build:
      context: ../services/chat-service
      dockerfile: Dockerfile
    image: transcendence-chat-service:latest
    container_name: chat-service
    environment:
      - PORT=8082
      - SPRING_APPLICATION_NAME=chat-service
      - EUREKA_URL=https://eureka-server:${EUREKA_PORT:-8761}/eureka/
      - CERT_DIR_PATH=/app/certs
      - JWKS_URI=https://gateway:${GATEWAY_PORT:-8080}/.well-known/jwks.json
      - JWT_PUBLIC_KEY_PATH=/app/certs/jwt/jwt_public.pem
      - CERT_PASSWORD=${CERT_PASSWORD}
    volumes:
      - ../certs:/app/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/chat-service/chat-service.crt", "--key", "/app/certs/services/chat-service/chat-service.key", "-f", "https://localhost:8082/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - transcendence-net
# == 7. Bridge Network Connectivity ==
networks:
  transcendence-net:
    external: true


