# ==========================================
# TRANSCENDENCE MICROSERVICES APPLICATION STACK
# ==========================================
# Run after starting the infrastructure compose stack:
# docker compose -f docker-compose.yml up -d
# docker compose -f docker-compose.apps.yml up --build -d

services:
  # == 1. Spring Cloud Config Server (Internal Only) ==
  config-server:
    build:
      context: ../services/config-server
      dockerfile: Dockerfile
    image: transcendence-config-server:latest
    container_name: config-server
    environment:
      - SPRING_PROFILES_ACTIVE=native,docker
      - CERT_PASSWORD=${CERT_PASSWORD}
    volumes:
      - ../certs/services/config-server/config-server.p12:/app/certs/services/config-server/config-server.p12:ro
      - ../certs/truststore/truststore.p12:/app/certs/truststore/truststore.p12:ro
      - ../config/config-repo:/app/config-repo:ro # Mounts local git configuration repository
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/config-server/config-server.p12:${CERT_PASSWORD}", "--cert-type", "P12", "-f", "https://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - transcendence-net

  # == 2. Eureka Service Discovery Registry (Internal Only) ==
  eureka-server:
    build:
      context: ../services/eureka-server
      dockerfile: Dockerfile
    image: transcendence-eureka-server:latest
    container_name: eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CERT_PASSWORD=${CERT_PASSWORD}
    volumes:
      - ../certs/services/eureka-server/eureka-server.p12:/app/certs/services/eureka-server/eureka-server.p12:ro
      - ../certs/truststore/truststore.p12:/app/certs/truststore/truststore.p12:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/eureka-server/eureka-server.p12:${CERT_PASSWORD}", "--cert-type", "P12", "-f", "https://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8761:8761"
    networks:
      - transcendence-net

  # == 3. Core Authentication Service (Internal Only) ==
  auth-service:
    build:
      context: ../
      dockerfile: services/auth-service/Dockerfile
    image: transcendence-auth-service:latest
    container_name: auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CERT_PASSWORD=${CERT_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - POSTGRES_PORT=5432
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
    volumes:
      - ../certs/services/auth-service/auth-service.p12:/app/certs/services/auth-service/auth-service.p12:ro
      - ../certs/truststore/truststore.p12:/app/certs/truststore/truststore.p12:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/auth-service/auth-service.p12:${CERT_PASSWORD}", "--cert-type", "P12", "-f", "https://localhost:8443/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - transcendence-net

  # == 4. Social Service (Internal Only) ==
  social-service:
    build:
      context: ../
      dockerfile: services/social-service/Dockerfile
    image: transcendence-social-service:latest
    container_name: social-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CERT_PASSWORD=${CERT_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - POSTGRES_PORT=5432
    volumes:
      - ../certs/services/social-service/social-service.p12:/app/certs/services/social-service/social-service.p12:ro
      - ../certs/truststore/truststore.p12:/app/certs/truststore/truststore.p12:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/social-service/social-service.p12:${CERT_PASSWORD}", "--cert-type", "P12", "-f", "https://localhost:8443/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - transcendence-net

  # == 5. Backend-For-Frontend (BFF) Gateway (Public Entrypoint) ==
  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    image: transcendence-gateway:latest
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8443" # ONLY the Gateway is exposed to the host system!
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CERT_PASSWORD=${CERT_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FORTYTWO_CLIENT_ID=${FORTYTWO_CLIENT_ID}
      - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET}
      - OAUTH2_REDIRECT_BASE_URL=${OAUTH2_REDIRECT_BASE_URL:-https://localhost:8080}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
    volumes:
      - ../certs/services/gateway/gateway.p12:/app/certs/services/gateway/gateway.p12:ro
      - ../certs/truststore/truststore.p12:/app/certs/truststore/truststore.p12:ro
      - ../certs/jwt/jwt_private_pkcs8.pem:/app/certs/jwt/jwt_private_pkcs8.pem:ro
      - ../certs/jwt/jwt_public.pem:/app/certs/jwt/jwt_public.pem:ro
    healthcheck:
      test: [ "CMD", "curl", "-k", "--cert", "/app/certs/services/gateway/gateway.p12:${CERT_PASSWORD}", "--cert-type", "P12", "-f", "https://localhost:8443/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      social-service:
        condition: service_healthy
    networks:
      - transcendence-net

# == 7. Bridge Network Connectivity ==
networks:
  transcendence-net:
    external: true


