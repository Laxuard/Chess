# ==========================================
# GATEWAY ROUTING & EDGE CONFIGURATION
# ==========================================

server:
  port: ${GATEWAY_PORT}
  ssl:
    client-auth: none

spring:
# == Redis Session Management ==
  session:
    timeout: 7d
    data:
      redis:
        namespace: "transcendence"
        save-mode: on-set-attribute
        repository-type: indexed
  data:
    redis:
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
# == WebClient Configuration for Inter-Service Communication ==
  cloud:
    gateway:
      server:
        webflux:
        # == SSL Configuration for WebClient ==
          httpclient:
            wiretap: true
            ssl:
              key-store-type: PKCS12
              key-password: "${CERT_PASSWORD}"
              key-store-password: "${CERT_PASSWORD}"
        # == Discovery Configuration ==
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
        # == Route Configuration ==
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2