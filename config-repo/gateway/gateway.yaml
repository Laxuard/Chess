# ==========================================
# GATEWAY ROUTING & EDGE CONFIGURATION
# ==========================================

server:
  port: ${GATEWAY_PORT}
  ssl:
    client-auth: none

spring:
  # == Redis Session Management ==
  session:
    timeout: 7d
    data:
      redis:
        namespace: "transcendence"
        save-mode: on-set-attribute
        repository-type: indexed
  data:
    redis:
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  # == Security & OAuth2 Configuration ==
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

  # == WebClient & Netty Routing Engine Client SSL Configuration ==
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            wiretap: true
            ssl:
              ssl-bundle: microservice-bundle
        # == Discovery Configuration ==
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            # OpenAPI Spec Bypass (High Priority)
            - id: auth-service-openapi-bypass
              uri: lb://auth-service
              order: 1
              predicates:
                - Path=/api/auth/v3/api-docs/**, /api/auth/v3/api-docs
              filters:
                - StripPrefix=2

            # Public paths
            - id: auth-service-public
              uri: lb://auth-service
              order: 2
              predicates:
                - Path=/api/auth/login, /api/auth/register
              filters:
                - StripPrefix=2

            # Semi-Protected (2FA challenge)
            - id: auth-service-2fa-verification
              uri: lb://auth-service
              order: 3
              predicates:
                - Path=/api/auth/2fa/verify
              filters:
                - StripPrefix=2
                - SessionToJwt

            # Secure Catch-All (Enforces Full Authentication)
            - id: auth-service-secure-catchall
              uri: lb://auth-service
              order: 4
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2
                - SessionToJwt
                - TwoFactorCheck

# ==========================================
# OPENAPI / SWAGGER AGGREGATION CONFIGURATION
# ==========================================
springdoc:
  swagger-ui:
    use-root-path: false
    urls:
      - name: "Authentication Service"
        url: "/api/auth/v3/api-docs"

# ==========================================
# APPLICATION CORE SECURITY & CORS CONFIG
# ==========================================
app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
